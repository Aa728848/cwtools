[workspace]
resolver = "2"
members = [
    "crates/cwtools-source",
    "crates/cwtools-protocol",
    "crates/cwtools-transport",
    "crates/cwtools-leaf",
    "crates/cwtools-script-syntax",
    "crates/cwtools-domain",
    "crates/cwtools-docs",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
